# 설치형 배포 (서버 한 대). 사용법은 deploy/README.md
#   cd deploy && docker compose up -d
#
# 처음 실행하면 setup이 비밀번호를 만들고 검색 모델(약 6GB)을 받는다. 진행 상황: docker compose logs -f setup
# 같은 폴더의 compose.override.yaml(데모 로그인 Keycloak)이 함께 읽힌다. 회사 로그인 시스템을 쓰면 그 파일을
# 지우고 .env에 OIDC_*를 채운다 (deploy/README.md "로그인").
#
# 원칙
# - DB는 포트를 열지 않는다 (같은 compose 네트워크의 컨테이너만 접속)
# - 앱은 이 서버(127.0.0.1)에만 연다. 직원 접속은 회사 리버스 프록시(HTTPS)를 앞에 둔다
# - 계정을 나눈다: 마이그레이션·보관 기간 삭제는 소유자 계정, 앱과 수집은 rag_app 역할의 로그인 계정
# - 비밀번호는 비밀 볼륨의 파일로 넘기고, 볼륨은 필요한 서비스에만 붙인다 (앱은 소유자 비밀번호를 모른다)

name: rag-service

# 앱 이미지: 이 코드 버전(pyproject.toml의 version)과 같은 태그의 공개 이미지를 받는다 (CI의 release가 올린다).
# 서버에 없을 때만 받고, 받을 수 없으면(아직 올리지 않은 버전, 비공개 저장소) 이 저장소의 Dockerfile로 직접 만든다.
# 코드를 고쳐서 쓰려면 docker compose up -d --build
x-app-image: &app-image
  image: ${APP_IMAGE:-ghcr.io/jc032896/rag-service:0.3.1}
  pull_policy: missing
  build:
    context: ..
    dockerfile: Dockerfile

x-app-db: &app-db
  POSTGRES_HOST: db
  POSTGRES_DB: ${DB_NAME:-rag}
  POSTGRES_USER: ${APP_DB_USER:-rag_service}
  POSTGRES_PASSWORD_FILE: /run/rag/app/app_db_password

services:
  # 시작할 때마다 한 번 실행하고 끝난다. 비밀번호 파일은 없을 때만 만들고(.env에 값이 있으면 그 값),
  # 모델은 없는 파일만 받는다. OFFLINE_INSTALL=1이면 받지 않고 있는지만 확인한다 (폐쇄망)
  setup:
    <<: *app-image
    user: "0"  # 비밀 볼륨과 모델 볼륨에 처음 쓰기 위해서만 root. 끝나면 모델을 앱 사용자에게 넘긴다
    command: ["sh", "-c", "python -m rag_service.deploy prepare && chown -R 10001 /models"]
    restart: "no"
    environment:
      OWNER_SECRETS_DIR: /run/rag/owner
      APP_SECRETS_DIR: /run/rag/app
      KEYCLOAK_SECRETS_DIR: /run/rag/keycloak
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:-}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      HF_HUB_OFFLINE: ${OFFLINE_INSTALL:-0}
    volumes:
      - models:/models
      - owner-secrets:/run/rag/owner
      - app-secrets:/run/rag/app
      - keycloak-secrets:/run/rag/keycloak

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_OWNER_USER:-rag_owner}
      POSTGRES_PASSWORD_FILE: /run/rag/owner/db_owner_password
      POSTGRES_DB: ${DB_NAME:-rag}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - owner-secrets:/run/rag/owner:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      setup:
        condition: service_completed_successfully

  # 시작할 때마다 한 번: 스키마를 최신으로 올리고 앱·감사자 로그인 계정을 맞춘다.
  # 보관 기간 삭제도 이 서비스(소유자 계정)로 실행한다:
  #   docker compose run --rm migrate python -m rag_service.audit purge
  migrate:
    <<: *app-image
    command: ["sh", "-c", "alembic upgrade head && python -m rag_service.deploy create-db-users"]
    restart: "no"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_NAME:-rag}
      POSTGRES_USER: ${DB_OWNER_USER:-rag_owner}
      POSTGRES_PASSWORD_FILE: /run/rag/owner/db_owner_password
      APP_DB_USER: ${APP_DB_USER:-rag_service}
      APP_DB_PASSWORD_FILE: /run/rag/app/app_db_password
      AUDIT_DB_USER: ${AUDIT_DB_USER:-rag_audit_ops}
      AUDIT_DB_PASSWORD_FILE: /run/rag/app/audit_db_password
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS-}
    volumes:
      - owner-secrets:/run/rag/owner:ro
      - app-secrets:/run/rag/app:ro
    depends_on:
      db:
        condition: service_healthy

  # 시작할 때마다 한 번: 문서 폴더를 증분 수집한다 (바뀐 문서만). 앱 시작을 막지 않는다
  sync:
    <<: *app-image
    command: ["python", "-m", "rag_service.ingest", "/data/corpus"]
    restart: "no"
    environment:
      <<: *app-db
      HF_HUB_OFFLINE: "1"
    volumes:
      - models:/models
      - ${CORPUS_DIR:-../samples}:/data/corpus:ro
      - app-secrets:/run/rag/app:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    <<: *app-image
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - models:/models
      # 수집한 문서 폴더 (org.yaml, acl.yaml, docs/). 앱은 읽기만 한다 (/health의 신선도 요약)
      - ${CORPUS_DIR:-../samples}:/data/corpus:ro
      - app-secrets:/run/rag/app:ro
      # 관리 화면에서 올린 문서의 원문 (권한의 원본은 DB). DB와 함께 백업한다
      - uploads:/data/uploads
    environment:
      <<: *app-db
      PRELOAD_MODELS: "true"
      HF_HUB_OFFLINE: "1"
      # 리버스 프록시가 보내는 X-Forwarded-For를 믿을 주소 (감사 기록의 client_ip)
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # 답변 LLM: claude(기본) 또는 openai_compatible(사내 vLLM·Ollama, 아래 ollama 서비스 참고)
      LLM_PROVIDER: ${LLM_PROVIDER:-claude}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5-5}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      AUTH_MODE: ${AUTH_MODE:-oidc}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_LOGIN_CLAIM: ${OIDC_LOGIN_CLAIM:-email}
      OIDC_ALLOW_HTTP_HOSTS: ${OIDC_ALLOW_HTTP_HOSTS:-}
      # 관리 화면 역할: 토큰의 그룹 값 이름과 역할마다 대응하는 그룹 (README "관리 API")
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
      ADMIN_GROUP: ${ADMIN_GROUP:-rag-admin}
      DOC_MANAGER_GROUP: ${DOC_MANAGER_GROUP:-rag-doc-manager}
      AUDITOR_GROUP: ${AUDITOR_GROUP:-rag-auditor}
      # 관리 화면의 감사 기록은 감사 담당 계정(rag_auditor 역할, 감사 테이블 읽기만)으로 읽는다.
      # ADMIN_AUDIT_VIEW=false면 앱이 이 계정을 쓰지 않는다 (README "관리 API")
      ADMIN_AUDIT_VIEW: ${ADMIN_AUDIT_VIEW:-true}
      AUDIT_DB_USER: ${AUDIT_DB_USER:-rag_audit_ops}
      AUDIT_DB_PASSWORD_FILE: /run/rag/app/audit_db_password
      AUDIT_STORE_TEXT: ${AUDIT_STORE_TEXT:-true}
      # 채팅 화면(http://<서버>/)의 대화 기록 보관 기간(일). 0이면 저장하지 않는다 (감사 기록과 별개)
      CHAT_HISTORY_DAYS: ${CHAT_HISTORY_DAYS:-90}
      UPLOAD_DIR: /data/uploads
      # 채팅 화면(http://<서버>/)과 관리 화면(/admin): 회사 이름·로고, 브라우저 로그인 클라이언트 id
      COMPANY_NAME: ${COMPANY_NAME:-}
      COMPANY_LOGO_URL: ${COMPANY_LOGO_URL:-}
      ADMIN_UI_CLIENT_ID: ${ADMIN_UI_CLIENT_ID:-}
      # 리버스 프록시의 요청 크기 제한(nginx client_max_body_size)도 이보다 크게 둔다
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-30}
      # 값을 비우면(KEY=) 그 한도를 두지 않는다. 변수가 아예 없으면 기본값
      LLM_DAILY_REQUESTS_PER_USER: ${LLM_DAILY_REQUESTS_PER_USER-200}
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD-20}
      LLM_CONCURRENT_PER_USER: ${LLM_CONCURRENT_PER_USER-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # 사내 LLM 예시 (선택): docker compose --profile ollama up -d
  #   docker compose exec ollama ollama pull <모델>   (예: gemma3:12b, 한 번만)
  #   설정: LLM_PROVIDER=openai_compatible, LLM_BASE_URL=http://ollama:11434/v1, LLM_MODEL=<모델>
  # GPU를 쓰려면 NVIDIA Container Toolkit을 설치하고 아래 deploy 주석을 푼다 (없으면 CPU로 매우 느리다).
  # 동시 사용자가 많으면 Ollama 대신 vLLM 같은 서버를 별도 GPU 서버에 둔다
  ollama:
    image: ollama/ollama:0.40.11
    profiles: ["ollama"]
    restart: unless-stopped
    environment:
      # 문맥 길이를 넉넉히 둔다. 샘플 문서의 요청(근거 5개 + 시스템 프롬프트)은 약 1천 토큰이지만,
      # 조각이 긴 문서에서 기본값(4096)을 넘으면 Ollama가 앞부분을 오류 없이 잘라내 근거가 사라진다
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes:
      - ollama:/root/.ollama
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  pgdata:
  models:
  uploads:            # 관리 화면에서 올린 문서 원문: app
  ollama:
  # 비밀번호 파일. 서비스마다 필요한 볼륨만 붙인다
  owner-secrets:      # DB 소유자: setup, db, migrate
  app-secrets:        # 앱·감사 계정: setup, migrate, sync, app
  keycloak-secrets:   # 데모 Keycloak 관리자: setup, keycloak
