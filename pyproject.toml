[project]
name = "rag-service"
version = "0.4.0"
description = "권한 인식 한국어 문서 질의 서비스 (RAG)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.6.0",
    "fastapi>=0.162.2",
    "httpx2>=2.16.0",
    "kiwipiepy>=0.24.1",
    "olefile>=0.47",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2.1.8",
    "torch>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rag_service"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PGH", "RUF100"]
# PGH003: 코드 없는 `# type: ignore` 금지, PGH004: 코드 없는 `# noqa` 금지
# RUF100: 쓸모없어진 `# noqa` 금지

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
enable_error_code = ["ignore-without-code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["rag_service"]
branch = true

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.4",
    "types-olefile>=0.47.0.20260508",
    "types-pyyaml>=6.0.12.20261103",
]

# PyTorch는 CPU 빌드만 쓴다 (CI와 로컬 모두 GPU 없음, CUDA 빌드는 수 GB)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
