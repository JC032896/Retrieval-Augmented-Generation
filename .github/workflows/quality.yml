name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml이 이미지를 올리기 전에 같은 게이트를 부른다
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # DB 테스트(tests/fixtures/db.py)용 Postgres. 로컬의 docker-compose.yml과 같은 이미지와 계정
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PYTHONUTF8: "1"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      # protected.py와 metrics.py는 venv가 아닌 시스템 Python(-I -S)으로 실행한다
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      # 커밋된 lock 파일을 그대로 믿지 않고, 보호 경로의 해시를 직접 다시 계산해 비교한다
      - name: 보호 경로 무결성 (해시 재계산)
        run: python3 -I -S .claude/scripts/protected.py check --ci

      - name: 의존성 설치
        run: uv sync --frozen

      # 관리 화면(web/admin): package-lock.json 그대로 설치한다. 게이트가 타입체크·lint·테스트를 돌린다
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/admin/package-lock.json

      - name: 화면 의존성 설치
        working-directory: web/admin
        run: npm ci --no-audit --no-fund

      - name: 품질 게이트 --full
        run: bash .claude/scripts/quality_gate.sh --full

      # 게이트의 평가가 방금 수집한 rag_eval DB가 원문(samples)·임베딩 모델과 맞는지 확인한다 (읽기 전용)
      - name: 인덱스 신선도 점검 (평가 DB)
        env:
          POSTGRES_DB: rag_eval
        run: uv run python -m rag_service.ingest check samples

      - name: 게이트 로그
        if: always()
        run: cat .claude/state/gate.log || true
